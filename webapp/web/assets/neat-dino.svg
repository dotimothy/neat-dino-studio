<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Neat DINO Studio: a dinosaur found by a detection box with its label tag, and the Neat sparkle. -->
  <defs>
    <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="40" y1="70" x2="216" y2="220">
      <stop offset="0" stop-color="#16c8a6"/><stop offset=".28" stop-color="#4bb54a"/><stop offset=".52" stop-color="#a9c81c"/>
      <stop offset=".76" stop-color="#3a86ec"/><stop offset="1" stop-color="#f2801d"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a222c"/><stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)" stroke="#2b3541" stroke-width="2"/>
  <!-- the label tag on top of the box -->
  <rect x="44" y="64" width="64" height="22" rx="6" fill="url(#spectrum)"/>
  <rect x="53" y="72" width="34" height="6" rx="3" fill="#0c1016" opacity=".75"/>
  <!-- detection box -->
  <rect x="44" y="84" width="168" height="128" rx="16" fill="none" stroke="url(#spectrum)" stroke-width="9"/>
  <!-- the dinosaur (T. rex in profile) -->
  <path fill="#f4f6f8" d="M60 168 C82 160 98 140 122 130 L138 110 C144 99 158 96 174 98 L196 102
    C203 103 204 112 198 114 L178 116 L178 120 L193 122 C195 128 190 131 184 131 L161 132
    C153 134 150 140 150 148 L150 158 C150 170 144 178 136 182 L140 198 L151 200 L151 205 L127 205
    L123 188 C117 190 109 190 103 188 L100 205 L84 205 L84 200 L92 198 L90 182 C82 178 72 174 60 168 Z"/>
  <path fill="#f4f6f8" d="M149 151 L163 154 L166 160 L161 161 L159 158 L150 159 Z"/>
  <circle cx="175" cy="108" r="3.6" fill="#0c1016"/>
  <!-- the Neat sparkle -->
  <g transform="translate(200 52) scale(.92)">
    <path d="M0 -34 L7 -7 L0 0 L-7 -7 Z" fill="#16c8a6"/>
    <path d="M34 0 L7 7 L0 0 L7 -7 Z" fill="#a9c81c"/>
    <path d="M0 34 L-7 7 L0 0 L7 7 Z" fill="#f2801d"/>
    <path d="M-34 0 L-7 -7 L0 0 L-7 7 Z" fill="#3a86ec"/>
    <circle r="4.5" fill="#0c1016"/>
  </g>
</svg>
